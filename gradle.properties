org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# AGP 8.5.2 was only tested up to compileSdk 34 -- suppresses the resulting build warning now
# that compileSdk/targetSdk are 36 (see app/build.gradle.kts's doc for why). The build itself
# already works fine at compileSdk 36 with this AGP version; a full AGP bump is a separate,
# larger change (Gradle wrapper version, Kotlin plugin compatibility, the cargoNdkBuild native
# task) not undertaken here just to silence this specific warning.
android.suppressUnsupportedCompileSdk=36
